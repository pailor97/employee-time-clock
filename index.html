<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Employee Time Clock</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 40px 20px;
    }

    .clock {
      background: white;
      max-width: 700px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h1 {
      font-size: 42px;
    }

    p {
      font-size: 22px;
    }

    #reader {
      width: 500px;
      max-width: 100%;
      margin: 30px auto;
    }

    #result {
      font-size: 28px;
      margin-top: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="clock">

    <h1>Employee Time Clock</h1>

    <p>Place your employee badge under the scanner.</p>

    <div id="reader"></div>

    <div id="result">
      Waiting for badge...
    </div>

  </div>


<script>

function onScanSuccess(decodedText) {

  document.getElementById("result").innerHTML =
    "Badge Detected: " + decodedText;

}

function onScanFailure(error) {
  // Ignore scanning errors while camera is looking
}

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: 250
  },
  false
);

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
