<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Employee Time Clock</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 40px 20px;
    }

    .clock {
      background: white;
      max-width: 700px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h1 {
      font-size: 42px;
    }

    p {
      font-size: 22px;
    }

    #reader {
      width: 500px;
      max-width: 100%;
      margin: 30px auto;
    }

    #result {
      font-size: 28px;
      margin-top: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="clock">

    <h1>Employee Time Clock</h1>

    <p>Place your employee badge under the scanner.</p>

    <div id="reader"></div>

    <div id="result">
      Waiting for badge...
    </div>

  </div>


<script>

let badgeProcessed = false;

function onScanSuccess(decodedText) {

  if (badgeProcessed) return;

  badgeProcessed = true;

  const employeeId =
    decodedText.trim().toUpperCase();

  document.getElementById("result").innerHTML =
    "Looking up employee...";

  lookupEmployee(employeeId);
}




function lookupEmployee(employeeId) {

  const appsScriptUrl =
    "https://script.google.com/macros/s/AKfycbyWTj7a6aopQprKC9Cf4luSzPhPmOyfI9HLadhKgxwmVVAs6MuscfyiYfVSj5aSJ3zpKA/exec";

  const script = document.createElement("script");

  script.src =
    appsScriptUrl +
    "?action=lookup" +
    "&employeeId=" +
    encodeURIComponent(employeeId) +
    "&callback=showEmployee";

  script.onerror = function() {
    document.getElementById("result").innerHTML =
      "<strong>Lookup failed.</strong><br>Please try again.";
    badgeProcessed = false;
  };

  document.body.appendChild(script);
}


window.showEmployee = function(employee) {

  const result =
    document.getElementById("result");

  if (!employee.found) {

    result.innerHTML =
      "<h2>Employee Not Found</h2>" +
      "<p>Please try your badge again.</p>";

    setTimeout(resetScanner, 3000);
    return;
  }

  if (
    String(employee.status).toUpperCase() === "IN"
  ) {

    result.innerHTML =
      "<h2>Welcome, " +
      employee.name +
      "!</h2>" +
      "<p>You are currently <strong>CLOCKED IN</strong>.</p>";

  } else {

    result.innerHTML =
      "<h2>Welcome, " +
      employee.name +
      "!</h2>" +
      "<p>You are currently <strong>CLOCKED OUT</strong>.</p>";

  }
};

   


function resetScanner() {

  badgeProcessed = false;

  document.getElementById("result").innerHTML =
    "Waiting for badge...";
}

function onScanFailure(error) {
  // Ignore scanning errors while camera is looking
}

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: 250
  },
  false
);

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
