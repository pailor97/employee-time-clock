<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Employee Time Clock</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 40px 20px;
    }

    .clock {
      background: white;
      max-width: 700px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 32px;
    }

    p {
      font-size: 22px;
    }

    #reader {
      width: 500px;
      max-width: 100%;
      margin: 30px auto;
    }

    #result {
      font-size: 26px;
      margin-top: 25px;
    }

    button {
      font-size: 28px;
      font-weight: bold;
      padding: 20px 40px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .clockIn {
      background: #28a745;
      color: white;
    }

    .clockOut {
      background: #dc3545;
      color: white;
    }

    .success {
      font-size: 34px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="clock">

    <h1>Employee Time Clock</h1>

    <p>Place your employee badge under the scanner.</p>

    <div id="reader"></div>

    <div id="result">
      Waiting for badge...
    </div>

  </div>

<script>

const appsScriptUrl =
  "https://script.google.com/macros/s/AKfycbyWTj7a6aopQprKC9Cf4luSzPhPmOyfI9HLadhKgxwmVVAs6MuscfyiYfVSj5aSJ3zpKA/exec";

let badgeProcessed = false;
let currentEmployeeId = "";


/* -----------------------------
   QR SCANNER
----------------------------- */

function onScanSuccess(decodedText) {

  if (badgeProcessed) return;

  badgeProcessed = true;

  currentEmployeeId =
    decodedText.trim().toUpperCase();

  document.getElementById("result").innerHTML =
    "Looking up employee...";

  lookupEmployee(currentEmployeeId);
}


function onScanFailure(error) {
  // Ignore normal scan failures while camera is searching
}


/* -----------------------------
   EMPLOYEE LOOKUP
----------------------------- */

function lookupEmployee(employeeId) {

  const script =
    document.createElement("script");

  script.src =
    appsScriptUrl +
    "?action=lookup" +
    "&employeeId=" +
    encodeURIComponent(employeeId) +
    "&callback=showEmployee" +
    "&_=" + Date.now();

  script.onerror = function() {

    document.getElementById("result").innerHTML =
      "<h2>Lookup failed.</h2>" +
      "<p>Please try again.</p>";

    setTimeout(resetScanner, 3000);
  };

  document.body.appendChild(script);
}


window.showEmployee = function(employee) {

  const result =
    document.getElementById("result");

  if (!employee.found) {

    result.innerHTML =
      "<h2>Employee Not Found</h2>" +
      "<p>Please try your badge again.</p>";

    setTimeout(resetScanner, 3000);

    return;
  }


  if (
    String(employee.status)
      .toUpperCase() === "IN"
  ) {

    result.innerHTML =
      "<h2>Welcome, " +
      employee.name +
      "!</h2>" +

      "<p>You are currently " +
      "<strong>CLOCKED IN</strong>.</p>" +

      "<button class='clockOut' " +
      "onclick=\"sendClockAction('CLOCK OUT')\">" +
      "CLOCK OUT" +
      "</button>";

  } else {

    result.innerHTML =
      "<h2>Welcome, " +
      employee.name +
      "!</h2>" +

      "<p>You are currently " +
      "<strong>CLOCKED OUT</strong>.</p>" +

      "<button class='clockIn' " +
      "onclick=\"sendClockAction('CLOCK IN')\">" +
      "CLOCK IN" +
      "</button>";
  }
};


/* -----------------------------
   CLOCK IN / CLOCK OUT
----------------------------- */

function sendClockAction(action) {

  document.getElementById("result").innerHTML =
    "<h2>Processing...</h2>";

  const script =
    document.createElement("script");

  script.src =
    appsScriptUrl +
    "?action=clock" +
    "&employeeId=" +
    encodeURIComponent(currentEmployeeId) +
    "&clockAction=" +
    encodeURIComponent(action) +
    "&callback=showClockConfirmation" +
    "&_=" + Date.now();

  script.onerror = function() {

    document.getElementById("result").innerHTML =
      "<h2>Clock action failed.</h2>" +
      "<p>Please try again.</p>";

    setTimeout(resetScanner, 3000);
  };

  document.body.appendChild(script);
}


window.showClockConfirmation =
function(response) {

  const result =
    document.getElementById("result");

  if (!response.success) {

    result.innerHTML =
      "<h2>Something went wrong.</h2>" +
      "<p>Please ask your supervisor for help.</p>";

    setTimeout(resetScanner, 4000);

    return;
  }

  result.innerHTML =
    "<div class='success'>✓ " +
    response.action +
    " SUCCESSFUL</div>" +

    "<p><strong>" +
    response.name +
    "</strong></p>" +

    "<p>" +
    response.time +
    "</p>" +

    "<p>Please remove your badge.</p>";

  setTimeout(resetScanner, 4000);
};


/* -----------------------------
   RESET
----------------------------- */

function resetScanner() {

  badgeProcessed = false;
  currentEmployeeId = "";

  document.getElementById("result").innerHTML =
    "Waiting for badge...";
}


/* -----------------------------
   START QR SCANNER
----------------------------- */

const scanner =
  new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: 250
    },
    false
  );

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
